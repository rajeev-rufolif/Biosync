<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05090A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2305090A' stroke='%232DE2A6' stroke-width='2.5'/%3E%3Cpath d='M5 20c4-1 5-9 11-9s6 9 11 9' fill='none' stroke='%23F4C95D' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Your schedule – BioSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="results">
<header class="wrap nav">
  <a class="logo" href="landing.html" aria-label="BioSync home"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#2DE2A6" stroke-width="2.5"/><path d="M5 20c4-1 5-9 11-9s6 9 11 9" fill="none" stroke="#F4C95D" stroke-width="2.5" stroke-linecap="round"/></svg>BioSync</a>
  <a class="link" href="chat.html">Back to chat</a>
</header>

<main class="wrap">
  <div class="results-head">
    <div>
      <h1 id="resultsTitle">Your week</h1>
      <p id="resultsSub">Built from your classes, deadlines, and routine.</p>
    </div>
    <div class="streak-wrap">
      <div class="streak" id="streak"></div>
      <button type="button" class="btn checkin" id="checkin">Check in today</button>
      <div class="timer" id="timer" role="timer"></div>
    </div>
  </div>

  <div id="resultsNotice"></div>

  <div id="resultsBody" aria-live="polite">
    <div class="week" id="weekSkeleton">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>
</main>
<noscript><p class="state">BioSync needs JavaScript to show your schedule.</p></noscript>
<script src="script.js"></script>
</body>
</html>
